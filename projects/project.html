<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>プロジェクト読み込み中…</title>
<link rel="stylesheet" href="../assets/style.css">
</head>
<body>

<button type="button" id="print-btn" class="print-btn" onclick="window.print()" aria-label="このページを印刷またはPDF保存">
  <span class="print-btn-icon" aria-hidden="true">🖨</span>
  <span class="print-btn-label">印刷 / PDF</span>
</button>

<div class="topbar">
  <div class="topbar-inner">
    <span class="breadcrumb" id="breadcrumb"></span>
    <span class="org-tag" id="org-tag"></span>
  </div>
</div>

<div id="state-message" class="state-message" style="display:none;"></div>

<div id="app" class="wrap" style="display:none;">
  <div class="hero">
    <div class="badges" id="badges"></div>
    <h1 class="title mincho" id="title"></h1>
    <div class="updated-at-row"><span id="updated-at" class="updated-at"></span></div>
    <p class="subtitle" id="subtitle"></p>
    <div class="meta-row" id="meta-row"></div>
    <a class="docs-link" id="docs-link" target="_blank" rel="noopener">📁 資料フォルダを開く</a>
  </div>

  <div class="live-card" id="live-card"></div>
  <div class="alert" id="alert"></div>

  <div class="tabs" id="tabs"></div>
  <div id="panels"></div>
</div>

<script src="../assets/app.js"></script>
</body>
</html>
